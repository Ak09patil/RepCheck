plugins {
    id 'com.android.application'
}

// Cloud sync is optional: without google-services.json the app builds and works fully offline.
// Follow FIREBASE_SETUP.md to add the file and switch sync on.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.repcheck.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.repcheck.app"
        // 28 = Android 9. Needed for MediaMetadataRetriever.getFramesAtIndex (fast frame extraction).
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    // MediaPipe reads the .task model straight from assets, so keep it uncompressed.
    androidResources {
        noCompress 'task'
    }
}

// Downloads the MediaPipe pose model into assets on the first build.
def poseModelUrl = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'
def poseModelFile = file("src/main/assets/pose_landmarker_lite.task")

tasks.register('downloadPoseModel') {
    onlyIf { !poseModelFile.exists() }
    doLast {
        poseModelFile.parentFile.mkdirs()
        ant.get(src: poseModelUrl, dest: poseModelFile)
    }
}
preBuild.dependsOn 'downloadPoseModel'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Camera
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"

    // Local database
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // On-device pose estimation
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Background sync
    implementation 'androidx.work:work-runtime:2.9.1'

    // Cloud (free Spark plan: Authentication + Firestore)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    testImplementation 'junit:junit:4.13.2'
}
